name: Bug report
description: Report a capture or application failure
body:
  - type: textarea
    attributes:
      label: Problem and reproduction
      description: Expected behavior, actual behavior, and steps to reproduce.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Commit/version, OS, .NET version, headset model, SteamVR and competing service state.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Diagnostics
      description: Relevant logs and /devices output. Redact serial numbers and omit eye images.
