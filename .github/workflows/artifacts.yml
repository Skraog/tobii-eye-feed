name: Release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.403
      - name: Tests
        run: dotnet test ReVision.Tests/ReVision.Tests.csproj -c Release --artifacts-path .local/artifacts/check -p:RestoreLockedMode=true
      - name: Package
        shell: pwsh
        run: ./scripts/Package.ps1 -Runtime ${{ matrix.runtime }}
      - name: Corresponding source
        if: runner.os == 'Linux'
        run: python scripts/source_archive.py artifacts/tobii-eye-feed-source.tar.gz
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name
          } | Set-Content artifacts/SHA256SUMS-${{ matrix.runtime }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tobii-eye-feed-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS-*.txt
